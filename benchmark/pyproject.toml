[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ginseng-retrieval-revision"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
